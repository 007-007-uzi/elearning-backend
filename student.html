<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand mb-0 h1">E-Learning Platform</span>
    <div class="d-flex align-items-center">
      <span class="text-white me-3" id="studentName">Student</span>
   

      <a href="index.html" class="btn btn-light btn-sm" id="logoutBtn">Logout</a>
    </div>
  </nav>

  <div class="container my-4">
    <h3 id="welcomeText">Welcome, Student</h3>
    
    <div class="card shadow-sm mt-4">
      <div class="card-body">
        <h5 class="card-title">My Courses</h5>
        <div class="row" id="courseList">

          <div class="col-md-4 mb-3">
            <div class="card h-100">
              <div class="card-body">
                <h6 class="card-title">Sample Course</h6>
                <p class="card-text text-muted">Teacher: Sample Teacher</p>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
     <div class="card shadow-sm mt-4">
      <div class="card-body">
        <h5 class="card-title">Assignments</h5>

        <ul class="list-group mb-4" id="assignmentList">
          <li class="list-group-item">Sample Assignment - Due: 25 Oct</li>
        </ul>

        <h6>Submit Assignment</h6>
        <form id="submissionForm">
          <div class="mb-3">
            <label for="assignmentSelect" class="form-label">Select Assignment</label>
            <select class="form-select" id="assignmentSelect">
              <option>Sample Assignment</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="submissionFile" class="form-label">Upload File</label>
            <input type="file" class="form-control" id="submissionFile">
          </div>
          <button type="submit" class="btn btn-primary" id="submitBtn">Submit</button>
        </form>

      </div>
    </div>
    <div class="card shadow-sm mt-4">
      <div class="card-body">
        <h5 class="card-title">Quizzes</h5>

        <ul class="list-group" id="quizList">
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Sample Quiz
            <button class="btn btn-sm btn-outline-primary">Start</button>
          </li>
        </ul>

      </div>
    </div>
</div>
  <!-- ═══ FLOATING CHAT WIDGET ═══ -->
  
  <!-- Chat Button -->
  <button class="chat-fab" id="chatToggleBtn">
    💬
  </button>

  <!-- Chat Popup Window -->
  <div class="chat-window" id="chatPopup">
    
    <div class="chat-header">
      <h6 class="m-0 fw-bold">Global Chat</h6>
      <button id="closeChatBtn" class="btn-close btn-close-white" aria-label="Close"></button>
    </div>
    
    <div class="chat-body" id="chatBox">
      <!-- Messages will be injected here -->
      <div class="text-center text-muted mt-5 small">Loading messages...</div>
    </div>

    <div class="chat-footer">
      <input type="text" id="chatInput" class="form-control form-control-sm" placeholder="Type a message..." autocomplete="off">
      <button id="sendChatBtn" class="btn btn-primary btn-sm px-3">Send</button>
    </div>
    
  </div>
  <!-- Search Modal -->
<div class="modal fade" id="searchModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Search Educational Resources</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="input-group mb-3">
          <input type="text" class="form-control" id="searchInput" placeholder="Search topics (e.g., Data Structures, React JS)...">
          <button class="btn btn-primary" id="searchBtn">Search</button>
        </div>
        
        <div id="searchResults" class="mt-3">
          <p class="text-muted text-center">Enter a topic to search the web.</p>
        </div>
      </div>
    </div>
  </div>
</div>

   <script type="module" src="student.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
