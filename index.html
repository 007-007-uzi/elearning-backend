<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Learning Platform - Login</title>

  <!-- Bootstrap 5 styles (loaded from the internet) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Our own styles (must come after Bootstrap) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow">
          <div class="card-body p-4">

            <h2 class="text-center mb-3">E-Learning Platform</h2>

            <!-- Login form -->
            <form id="loginForm">

              <!-- Email field -->
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email">
              </div>

              <!-- Password field -->
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password">
              </div>

              <!-- Role dropdown: decides which page opens after login -->
              <div class="mb-3">
                <label for="role" class="form-label">Login as</label>
                <select class="form-select" id="role">
                  <option value="student">Student</option>
                  <option value="teacher">Teacher</option>
                  <option value="admin">Admin</option>
                </select>
              </div>

              <!-- Message box (hidden until we need to show a message) -->
              <div id="message" class="alert d-none"></div>

              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Get the form and the message box from the page
    var form = document.getElementById("loginForm");
    var message = document.getElementById("message");

    // Run this code when the Login button is pressed
    form.addEventListener("submit", function (event) {
      // Stop the page from refreshing
      event.preventDefault();

      // Read what the user typed
      var email = document.getElementById("email").value;
      var password = document.getElementById("password").value;
      var role = document.getElementById("role").value;

      // Clear any old message colors and show the message box
      message.classList.remove("d-none", "alert-danger", "alert-success");

      if (email === "" || password.length < 6) {
        // Show a red error message
        message.classList.add("alert-danger");
        message.textContent = "Please enter your email and a password of at least 6 characters.";
      } else {
        // Show a green success message
        message.classList.add("alert-success");
        message.textContent = "Login successful!";

        // Open the page that matches the role (student.html, teacher.html or admin.html)
        window.location.href = role + ".html";
      }
    });
  </script>

</body>
</html>
