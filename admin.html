<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <!-- Bootstrap 5 styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Our own styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top navigation bar -->
  <nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand mb-0 h1">E-Learning Platform</span>
    <div class="d-flex align-items-center">
      <span class="text-white me-3" id="adminName">Admin</span>
      <a href="index.html" class="btn btn-light btn-sm" id="logoutBtn">Logout</a>
    </div>
  </nav>

  <div class="container my-4">
    <h3 id="welcomeText">Welcome, Admin</h3>

    <!-- Manage Users: list of all users with their roles -->
    <div class="card shadow-sm mt-4">
      <div class="card-body">
        <h5 class="card-title">Manage Users</h5>

        <table class="table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Action</th>
            </tr>
          </thead>
          <!-- The row below is a sample; real data will replace it later -->
          <tbody id="userTableBody">
            <tr>
              <td>Sample User</td>
              <td>sample@gmail.com</td>
              <td>Student</td>
              <td>
                <button class="btn btn-sm btn-outline-danger">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>

      </div>
    </div>
    <!-- Add User: form for creating a new user account -->
    <div class="card shadow-sm mt-4">
      <div class="card-body">
        <h5 class="card-title">Add User</h5>

        <form id="addUserForm">

          <div class="mb-3">
            <label for="newUserName" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="newUserName">
          </div>

          <div class="mb-3">
            <label for="newUserEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="newUserEmail">
          </div>

          <div class="mb-3">
            <label for="newUserPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="newUserPassword">
          </div>

          <!-- Role of the new user -->
          <div class="mb-3">
            <label for="newUserRole" class="form-label">Role</label>
            <select class="form-select" id="newUserRole">
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary" id="addUserBtn">Add User</button>
        </form>

      </div>
    </div>
        <!-- All Courses: every course on the platform -->
    <div class="card shadow-sm mt-4">
      <div class="card-body">
        <h5 class="card-title">All Courses</h5>

        <table class="table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Teacher</th>
              <th>Students</th>
              <th>Action</th>
            </tr>
          </thead>
          <!-- The row below is a sample; real data will replace it later -->
          <tbody id="allCoursesTableBody">
            <tr>
              <td>Sample Course</td>
              <td>Sample Teacher</td>
              <td>0</td>
              <td>
                <button class="btn btn-sm btn-outline-danger">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>

      </div>
    </div>
  </div>

</body>
</html>
